name: Trigger Vercel rebuild

# O deploy em si é feito pelo Vercel (ligado ao repo, builda a cada push).
# Isto só dispara um rebuild de hora a hora para o site apanhar eventos
# novos no Luma e mudanças de disponibilidade no Cal.com, sem precisar de
# um push de código.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o Deploy Hook do Vercel
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
